name: one-shot-delete-unfinished-public-refs
on:
  push:
    paths:
      - '.github/workflows/one-shot-delete-unfinished-public-refs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unfinished public Phase I software refs
        uses: actions/github-script@v7
        with:
          script: |
            const refs = [
              'heads/working/phase-i-software-2026-09',
              'tags/working/phase-i-software-2026-09-22',
            ];
            for (const ref of refs) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                core.info('Deleted refs/' + ref);
              } catch (e) {
                if (e.status === 404) {
                  core.info('Already gone: refs/' + ref);
                } else {
                  core.warning('Failed refs/' + ref + ': ' + e.message);
                  throw e;
                }
              }
            }
